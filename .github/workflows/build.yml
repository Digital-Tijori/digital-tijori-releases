# Builds the installers for a release of the (private) app repo and publishes them here.
# Started only by the app repo's "Build installers" workflow when a release is published there (or by hand from the Actions tab).
# Never runs on pull requests, forks or pushes.
name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release in Digital-Tijori/Digital-Tijori (for example v0.2.0)
        required: true
        type: string
      prerelease:
        description: Pre-release, so build for macOS Apple silicon only
        required: false
        default: false
        type: boolean

permissions:
  contents: write # create the release in this repo with the built-in token; no other repo is written

concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # A pre-release is tested on Apple silicon only, so it skips the other platforms.
      matrix:
        include: ${{ fromJSON(inputs.prerelease && '[{"name":"macOS Apple silicon","os":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"}]' || '[{"name":"macOS Apple silicon","os":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"},{"name":"macOS Intel","os":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin"},{"name":"Windows","os":"windows-latest","target":"","args":""},{"name":"Linux","os":"ubuntu-22.04","target":"","args":""}]') }}
    env:
      # baked into the app at compile time (public values, set under Settings > Secrets and variables > Actions > Variables)
      TIJORI_LICENSE_URL: ${{ vars.TIJORI_LICENSE_URL }}
      TIJORI_LICENSE_PUBKEYS: ${{ vars.TIJORI_LICENSE_PUBKEYS }}
    steps:
      - name: Get the app source
        uses: actions/checkout@v4
        with:
          repository: Digital-Tijori/Digital-Tijori
          ref: ${{ inputs.tag }}
          token: ${{ secrets.APP_REPO_TOKEN }} # read-only on the app repo
          persist-credentials: false

      - name: Set the app version from the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/set-version.mjs "$TAG"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this repo only
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }} # signs the update files; the key has no password
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Digital Tijori ${{ inputs.tag }}
          releaseBody: Download the file for your system. Open the app, enter the email you paid with, and click the button we send to that inbox.
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          args: ${{ matrix.args }}
